<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0b3f9e"/>
    </linearGradient>
  </defs>

  <!-- Rounded square badge -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bg)"/>

  <!-- Clock face -->
  <circle cx="64" cy="64" r="38" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5"/>

  <!-- Tick marks -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round">
    <line x1="64" y1="32" x2="64" y2="39"/>
    <line x1="96" y1="64" x2="89" y2="64"/>
    <line x1="64" y1="96" x2="64" y2="89"/>
    <line x1="32" y1="64" x2="39" y2="64"/>
  </g>

  <!-- Hands: 10:09 -->
  <g stroke="#ffffff" stroke-linecap="round">
    <line x1="64" y1="64" x2="46" y2="52" stroke-width="6"/>
    <line x1="64" y1="64" x2="82" y2="47" stroke-width="5"/>
  </g>

  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
