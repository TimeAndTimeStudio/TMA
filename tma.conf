# TMA application identity, startup target and window floor.
#
# One file drives four things, all of them decided when the binary is built:
#
#   app_name     the output binary (<app_name>)
#   app_id       the Wayland xdg_toplevel app_id, which is how a compositor
#                matches a window to its .desktop entry
#   startup      what the window opens with: "url:<url>", and nothing else
#   min_width    the narrowest the window may be, in pixels
#   min_height   the shortest the window may be, in pixels
#
# scripts/setup_chromium.sh reads this file and turns every key into a GN
# argument; //tma/tma_config.gni declares them and //tma/BUILD.gn bakes the
# values into the binary as preprocessor defines. That is why the values are
# build-time rather than runtime: the binary's own name cannot be changed by
# a file it reads, so one source of truth beats one that only half applies.
#
# TMA takes no command-line argument and no switch at all apart from --version
# and --version-browser, which report the Chromium this build embeds -- and it
# does not just ignore anything else, it refuses to start and names what you
# passed. A flag, a bare URL or a path is rejected in main() before Chromium is
# even initialised, so a file cannot be opened from the command line either.
# This file is the only thing that decides what the window opens and how large
# it may get, so two runs of the same binary always do the same thing.
#
# Re-run ./build.sh after editing this file -- a bare autoninja would keep
# rebuilding against the previous values.
#
# Syntax: flat `key = value`, one per line, `#` starts a comment line.
# Values are taken verbatim up to the end of the line; do not put a `#`
# inside a value.

# --- identity ----------------------------------------------------------------
# There is deliberately no window_title here. TMA draws its own top bar with
# no caption text in it (see tma/browser/tma_frame_view.h), so a title would
# have nowhere to appear; TmaPlatformDelegate does not forward the page's
# <title> either, and whatever is in a page's <title> is simply ignored.
#
# app_name and app_id must start with a letter or digit and use only letters,
# digits, '.', '_' and '-'. setup_chromium.sh rejects anything else, because
# app_name also becomes a file name.
app_name = tma
app_id = tma

# --- startup (required) ------------------------------------------------------
# What the window opens. Exactly one form:
#
#   startup = url:https://example.com
#
# http://, https://, data:, ... -- anything with a scheme. Leaving this empty,
# or writing anything that is not url:<url>, is an error at setup time, so a
# config always states what its application is for.
#
# There is no packaged page to fall back to. The URL above is the only thing
# the window will ever open, which is what makes the binary's behaviour
# reproducible from this file alone.
startup = url:https://example.com

# --- window floor ------------------------------------------------------------
# The smallest the window is allowed to be, in pixels. These are the client
# (web content) area; the strip TMA draws along the top adds to the height on
# top of min_height. Values must be positive integers -- setup_chromium.sh
# rejects anything else.
min_width = 320
min_height = 200
