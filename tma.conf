# TMA application identity and startup target.
#
# One file drives three things, all of them decided when the binary is built:
#
#   app_name      the output binary (<app_name>) and the resource directory
#                 (<app_name>_resources) sitting next to it
#   app_id        the Wayland xdg_toplevel app_id, which is how a compositor
#                 matches a window to its .desktop entry
#   startup       what the window opens with when no command-line argument is
#                 given: "file" or "url:<url>"
#
# scripts/setup_chromium.sh reads this file and turns every key into a GN
# argument; //tma/tma_config.gni declares them and //tma/BUILD.gn bakes the
# values into the binary as preprocessor defines. That is why the values are
# build-time rather than runtime: the binary's own name cannot be changed by
# a file it reads, so one source of truth beats one that only half applies.
#
# Re-run ./build.sh after editing this file -- a bare autoninja would keep
# rebuilding against the previous values.
#
# Syntax: flat `key = value`, one per line, `#` starts a comment line.
# Values are taken verbatim up to the end of the line; do not put a `#`
# inside a value.

# --- identity ----------------------------------------------------------------
# There is deliberately no window_title here. TMA draws its own top bar with
# no caption text in it (see tma/browser/tma_frame_view.h), so a title would
# have nowhere to appear; TmaPlatformDelegate does not forward the page's
# <title> either, and whatever is in a page's <title> is simply ignored.
#
# app_name and app_id must start with a letter or digit and use only letters,
# digits, '.', '_' and '-'. setup_chromium.sh rejects anything else, because
# app_name also becomes a file name and a fragment inside the fallback page.
app_name = tma
app_id = tma

# --- startup (required) ------------------------------------------------------
# What the window opens with. Leaving this empty is an error, so a config
# always states what its application is for.
#
# Exactly two values, and setup_chromium.sh rejects everything else:
#
#   startup = file                 the packaged application page:
#                                  <app_name>_resources/index.html
#   startup = url:https://example.com
#                                  a URL: http://, https://, data:, ...
#
# "file" deliberately takes no name. The entry point is fixed at index.html and
# the config does not get to choose which file inside the resources directory
# it is -- only whether to open that page or a URL instead. Every other file in
# tma/resources/ is copied beside it, so assets are simply dropped next to
# index.html.
#
# With url: the resources directory is not built at all -- a URL-configured
# build produces no <app_name>_resources.
#
# A bare command line argument always wins. There is deliberately no --url=
# switch as well: two spellings of one idea, and a URL or a path needs no flag.
#   build/<app_name> https://example.com
#   build/<app_name> /path/to/page.html
startup = file
